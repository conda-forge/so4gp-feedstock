{% set name = "so4gp" %}
{% set version = "1.0.9" %}
{% set python_min = "3.14" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/so4gp-{{ version }}.tar.gz
  sha256: ffeaf5db087a455eb95bc7f042460f26776716bbf775cd013d9b1d419bb205df

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=82.0
    - pip
  run:
    - python >={{ python_min }}
    - numpy ==2.5.3
    - pandas ==3.0.5
    - tabulate ==0.10.0
    - scikit-fuzzy ==0.5.0
    - scikit-learn ==1.9.1
    - seaborn ==0.13.2
    - matplotlib-base ==3.11.2
    - python-dateutil ==2.9.0
    - pytorch ==2.13

test:
  imports:
    - so4gp
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: Some Python optimization algorithms for mining gradual patterns.
  home: https://github.com/owuordickson/sogp_pypi
  license: GPL-3.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - owuordickson
