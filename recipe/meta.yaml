{% set name = "so4gp" %}
{% set version = "0.9.4" %}
{% set python_min = "3.14" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/so4gp-{{ version }}.tar.gz
  sha256: 8a92b8dc700bc1fc6443942aaee4a8364491b984e1bb2448aa749bc7afd3af71

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=82.0
    - pip
  run:
    - python >={{ python_min }}
    - numpy ==2.5.0
    - pandas ==3.0.3
    - tabulate ==0.10.0
    - scikit-fuzzy ==0.5.0
    - scikit-learn ==1.9.0
    - seaborn ==0.13.2
    - matplotlib-base ==3.11.0
    - python-dateutil ==2.9.0
    - mcp ==1.28.1

test:
  imports:
    - so4gp
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: Some Python optimization algorithms for mining gradual patterns.
  home: https://github.com/owuordickson/sogp_pypi
  license: GPL-3.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - owuordickson
